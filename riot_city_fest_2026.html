<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Event - Riot City Fest "ANGRY SHOW" 2026</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

    <!-- Header / Navbar Sederhana -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-xl text-blue-600">
                <i class="fa-solid fa-arrow-left"></i> Kembali
            </a>
            <h1 class="font-bold text-lg">Detail Event</h1>
            <div></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col md:flex-row gap-8">
            <!-- Banner Image -->
            <div class="w-full md:w-1/2">
                <img src="https://i.ibb.co.com/0RVJmVW0/BANNER-ANGRY-SHOW-21-X9.png" alt="Riot City Fest" class="w-full rounded-xl object-cover shadow-sm">
            </div>

            <!-- Detail Info -->
            <div class="w-full md:w-1/2 flex flex-col justify-between">
                <div>
                    <span class="bg-yellow-300 text-black text-xs font-bold px-2.5 py-1 rounded-md">ANGRY SHOW</span>
                    <h1 class="text-2xl font-bold mt-3">Riot City Fest "ANGRY SHOW" 2026</h1>
                    
                    <div class="mt-4 space-y-2 text-sm text-gray-600">
                        <p class="flex items-center gap-2"><i class="fa-regular fa-calendar text-blue-600"></i> 30 August 2026</p>
                        <p class="flex items-center gap-2"><i class="fa-solid fa-location-dot text-blue-600"></i> 53 Club, Karawang</p>
                    </div>

                    <hr class="my-4">

                    <p class="text-gray-600 text-sm leading-relaxed">
                        Nikmati malam penuh energi di Riot City Fest Karawang! Dapatkan tiket resminya sekarang sebelum kehabisan.
                    </p>
                </div>

                <!-- Section Beli Tiket -->
                <div class="mt-6 pt-4 border-t flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500">Harga Tiket</p>
                        <p class="text-2xl font-bold text-blue-600">Rp 35.000</p>
                    </div>
                    <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold transition-all">
                        Beli Tiket Sekarang
                    </button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
